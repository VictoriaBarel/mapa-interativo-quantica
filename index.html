<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interativo Quântica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent; /* fundo transparente */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      padding: 20px;
      box-sizing: border-box;
    }

    .mapa {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mapa svg, .mapa img {
      max-width: 100%;
      height: auto;
    }

    .painel {
      width: 350px;
      max-width: 100%;
      background: #fff;
      border-left: 2px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      display: none; /* escondido por padrão */
    }

    .painel img {
      width: 100%;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .painel.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mapa">
      <!-- Usa seu SVG exportado do Illustrator -->
      <img src="mapa.svg" alt="Mapa Interativo">
    </div>
    <div class="painel" id="painel">
      <img id="cardImagem" src="" alt="Card">
    </div>
  </div>

  <script>
    // Aqui você vincula os botões do seu SVG aos cards
    // Exemplo: se o botão/id no SVG for "Cidade1" e a imagem for "Cidade1.png"

    const painel = document.getElementById("painel");
    const cardImagem = document.getElementById("cardImagem");

    // Quando clicar em uma cidade
    function abrirCard(nomeCidade) {
      cardImagem.src = nomeCidade + ".png"; // Ajuste o caminho das imagens se necessário
      painel.classList.add("active");
    }

    // Exemplo de teste:
    // abrirCard("Cidade1");
  </script>
</body>
</html>
