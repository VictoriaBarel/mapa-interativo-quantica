<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Quântica</title>
  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Área do mapa */
    #mapa-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    svg {
      width: 90%;
      height: auto;
    }

    /* Painel lateral (sobreposto) */
    #painel {
      width: 350px;
      background: #fff;
      border-left: 2px solid #ddd;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      position: absolute;   /* sobreposto */
      top: 0;
      right: 0;
      height: 100%;
      box-shadow: -2px 0 6px rgba(0,0,0,0.15);
      z-index: 10;
    }

    #fechar {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      color: #555;
    }

    #card {
      max-width: 100%;
      max-height: 80%;
      object-fit: contain;
      margin-top: 30px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .navegacao {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .navegacao button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #888;
      background-color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .navegacao button:hover {
      background-color: #f0f0f0;
      border-color: #555;
    }

    #indicador {
      font-size: 14px;
      color: #333;
    }

    /* Responsividade */
    @media (max-width: 800px) {
      body {
        flex-direction: column;
      }
      #painel {
        width: 100%;
        border-left: none;
        border-top: 2px solid #ddd;
        flex-direction: row;
        justify-content: space-between;
        padding: 5px;
        height: auto;
        position: fixed;
        bottom: 0;
        top: auto;
        right: 0;
        left: 0;
        box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
      }
      #card {
        max-width: 60%;
        max-height: 150px;
        margin-top: 0;
      }
      .navegacao {
        gap: 10px;
      }
      #fechar {
        top: 5px;
        right: 5px;
      }
    }
  </style>
</head>
<body>

  <div id="mapa-container">
    <object id="mapa" type="image/svg+xml" data="mapa.svg"></object>
  </div>

  <div id="painel">
    <span id="fechar">✖</span>
    <img id="card" src="" alt="Card da cidade">
    <div class="navegacao">
      <button id="prev">⟵</button>
      <span id="indicador">0 / 0</span>
      <button id="next">⟶</button>
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const cardImg = document.getElementById('card');
    const indicador = document.getElementById('indicador');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnFechar = document.getElementById('fechar');

    let cidadeAtual = null;
    let indiceAtual = 1;

    // Lista completa de cards
    const listaCards = [
      "salvador-1","belohorizonte-1","recife-1","recife-2","natal-1",
      "saocarlos-1","bauru-1","campinas-1","campinas-2","campinas-3",
      "saopaulo-1","saopaulo-2","saocarlos-2","niteroi-1","riodejaneiro-1",
      "niteroi-2","riodejaneiro-2","riodejaneiro-3","florianopolis-1",
      "santamaria-1","curitiba-1","uberlandia-1","goiania-1","fortaleza-1",
      "maceio-1","arapiraca-1","cuiaba-1","patrocinio-1","araras-1",
      "juizdefora-1","vitoria-1","petropolis-1","sorocaba-1",
      "cornelioprocopio-1","itapeva-1","pontagrossa-1","santoandre-1",
      "voltaredonda-1","voltaredonda-2","florestal-1"
    ];

    // Monta objeto {cidade: [cards]}
    const cardsPorCidade = {};
    listaCards.forEach(nome => {
      const cidade = nome.replace(/-\d+$/, "");
      if (!cardsPorCidade[cidade]) cardsPorCidade[cidade] = [];
      cardsPorCidade[cidade].push(`cards/${nome}.jpg`);
    });

    function carregarCard(cidade, indice) {
      cardImg.src = cardsPorCidade[cidade][indice - 1];
      indicador.textContent = `${indice} / ${cardsPorCidade[cidade].length}`;
    }

    btnPrev.addEventListener('click', () => {
      if (indiceAtual > 1) {
        indiceAtual--;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnNext.addEventListener('click', () => {
      if (indiceAtual < cardsPorCidade[cidadeAtual].length) {
        indiceAtual++;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnFechar.addEventListener('click', () => {
      painel.style.display = 'none';
    });

    document.getElementById('mapa').addEventListener('load', function() {
      const svgDoc = this.contentDocument;
      const cidadesSVG = svgDoc.querySelectorAll('[id]');

      cidadesSVG.forEach(cidade => {
        if (cardsPorCidade[cidade.id]) {
          cidade.style.cursor = 'pointer';
          cidade.addEventListener('click', () => {
            cidadeAtual = cidade.id;
            indiceAtual = 1;
            painel.style.display = 'flex';
            carregarCard(cidadeAtual, indiceAtual);
          });
        }
      });
    });

  </script>
</body>
</html>
