<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Quântica</title>
  <style>
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: transparent;
}

/* Wrapper do mapa */
.mapa-wrapper {
  width: 100%;
  max-width: 100%; /* antes tinha limite em px */
  margin: auto;
}

/* Área do mapa */
#mapa-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: margin-right 0.4s ease;
  width: 70%; /* ocupa 70% da largura */
}

/* SVG do mapa */
svg {
  width: 100%;
  height: auto;
  max-width: 100%; /* antes tinha 1200px */
}

/* Painel lateral */
#painel {
  width: 30%; /* em vez de px */
  background: transparent;
  display: none; /* escondido por padrão */
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  box-sizing: border-box;
  position: absolute;
  top: 0;
  right: -30%; /* fora da tela inicialmente */
  height: 100%;
  transition: right 0.4s ease;
  z-index: 10;
}

#painel.ativo {
  display: flex;
  right: 0;
}

#mapa-container.deslocado {
  margin-right: 30%; /* acompanha a largura do painel */
}

/* Card */
.card-wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

#card {
  max-width: 95%;
  max-height: 85%;
  object-fit: contain;
  margin: auto;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  background: transparent;
  opacity: 0;
  transition: opacity 0.4s ease;
}

#card.visivel {
  opacity: 1;
}

/* Botão fechar */
#fechar {
  position: absolute;
  top: 6px;
  right: 6px;
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  color: #333;
  background: rgba(255,255,255,0.8);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  transition: 0.2s;
}

#fechar:hover {
  background: rgba(255,255,255,1);
}

/* Navegação */
.navegacao {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 10px;
}

.navegacao button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid #aaa;
  background-color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.navegacao button:hover:not(:disabled) {
  background-color: #f0f0f0;
  border-color: #555;
}

.navegacao button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#indicador {
  font-size: 14px;
  color: #333;
}

/* Responsividade */
@media (max-width: 800px) {
  body {
    flex-direction: column;
    height: auto;
  }
  .mapa-wrapper {
    flex-direction: column;
    max-width: 100%;
    height: auto;
  }
  #mapa-container {
    width: 100%;
    margin-right: 0 !important;
  }
  #painel {
    position: relative;
    width: 100%;
    right: 0;
    top: auto;
    height: auto;
    flex-direction: column;
    padding: 10px;
    box-shadow: none;
    transition: none;
    margin-top: 10px;
    display: none;
  }
  #painel.ativo {
    display: flex;
  }
  #card {
    max-width: 95%;
    max-height: 300px;
  }
  .navegacao {
    margin-top: 8px;
  }
}
  </style>
</head>
<body>

  <div class="mapa-wrapper">
    <div id="mapa-container">
      <object id="mapa" type="image/svg+xml" data="mapa.svg"></object>
    </div>

    <div id="painel">
      <div class="card-wrapper">
        <img id="card" src="" alt="Card da cidade">
        <span id="fechar">✖</span>
      </div>
      <div class="navegacao">
        <button id="prev">‹</button>
        <span id="indicador">0 / 0</span>
        <button id="next">›</button>
      </div>
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const mapaContainer = document.getElementById('mapa-container');
    const cardImg = document.getElementById('card');
    const indicador = document.getElementById('indicador');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnFechar = document.getElementById('fechar');

    let cidadeAtual = null;
    let indiceAtual = 1;

    const listaCards = [
      "salvador-1","belohorizonte-1","recife-1","recife-2","natal-1",
      "saocarlos-1","bauru-1","campinas-1","campinas-2","campinas-3",
      "saopaulo-1","saopaulo-2","saocarlos-2","niteroi-1","riodejaneiro-1",
      "niteroi-2","riodejaneiro-2","riodejaneiro-3","florianopolis-1",
      "santamaria-1","curitiba-1","uberlandia-1","goiania-1","fortaleza-1",
      "maceio-1","arapiraca-1","cuiaba-1","patrocinio-1","araras-1",
      "juizdefora-1","vitoria-1","petropolis-1","sorocaba-1",
      "cornelioprocopio-1","itapeva-1","pontagrossa-1","santoandre-1",
      "voltaredonda-1","voltaredonda-2","florestal-1"
    ];

    const cardsPorCidade = {};
    listaCards.forEach(nome => {
      const cidade = nome.replace(/-\d+$/, "");
      if (!cardsPorCidade[cidade]) cardsPorCidade[cidade] = [];
      cardsPorCidade[cidade].push(`cards/${nome}.jpg`);
    });

    function atualizarBotoes() {
      btnPrev.disabled = indiceAtual === 1;
      btnNext.disabled = indiceAtual === cardsPorCidade[cidadeAtual].length;
    }

    function carregarCard(cidade, indice) {
      cardImg.classList.remove('visivel');
      setTimeout(() => {
        cardImg.src = cardsPorCidade[cidade][indice - 1];
        indicador.textContent = `${indice} / ${cardsPorCidade[cidade].length}`;
        atualizarBotoes();
        cardImg.onload = () => cardImg.classList.add('visivel');
      }, 100);
    }

    btnPrev.addEventListener('click', () => {
      if (indiceAtual > 1) {
        indiceAtual--;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnNext.addEventListener('click', () => {
      if (indiceAtual < cardsPorCidade[cidadeAtual].length) {
        indiceAtual++;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnFechar.addEventListener('click', () => {
      painel.classList.remove('ativo');
      mapaContainer.classList.remove('deslocado');
      setTimeout(() => {
        painel.style.display = "none"; // fecha de verdade
      }, 400);
    });

    document.getElementById('mapa').addEventListener('load', function() {
      const svgDoc = this.contentDocument;
      const cidadesSVG = svgDoc.querySelectorAll('[id]');

      cidadesSVG.forEach(cidade => {
        if (cardsPorCidade[cidade.id]) {
          cidade.style.cursor = 'pointer';
          cidade.addEventListener('click', () => {
            painel.style.display = "flex"; // reexibe
            cidadeAtual = cidade.id;
            indiceAtual = 1;
            carregarCard(cidadeAtual, indiceAtual);
            painel.classList.add('ativo');
            mapaContainer.classList.add('deslocado');
          });
        }
      });
    });
  </script>
</body>
</html>
