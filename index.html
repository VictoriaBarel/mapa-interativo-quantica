<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interativo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff; /* fundo branco */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    .mapa {
      flex: 0 0 auto;
      max-width: 60%;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .painel {
      flex: 0 0 30%;
      max-width: 400px;
      background: #fff;
      padding: 20px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .painel img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .ativo .painel {
      display: flex;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .mapa {
        max-width: 100%;
      }
      .painel {
        width: 100%;
        max-width: none;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="mapa">
      <!-- SVG será embutido aqui -->
      <object id="svgMapa" data="mapa.svg" type="image/svg+xml"></object>
    </div>
    <div class="painel" id="painel"></div>
  </div>

  <script>
    const painel = document.getElementById("painel");
    const app = document.getElementById("app");

    document.getElementById("svgMapa").addEventListener("load", function() {
      const svgDoc = this.contentDocument;

      const cidades = ["Fortaleza", "Rio", "Niteroi"];

      cidades.forEach(cidade => {
        const el = svgDoc.getElementById(cidade);
        if(el) {
          el.style.cursor = "pointer";
          el.addEventListener("click", () => abrirCard(cidade));
        }
      });
    });

    function abrirCard(cidade) {
      painel.innerHTML = `<img src="${cidade}.jpg" alt="${cidade}">`;
      app.classList.add("ativo");
    }
  </script>
</body>
</html>
