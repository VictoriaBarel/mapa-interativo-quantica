<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interativo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent; /* fundo transparente */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .mapa {
      flex-shrink: 0;
      transition: transform 0.3s ease;
      max-width: 90%;
      max-height: 90%;
    }
    .painel {
      position: absolute;
      right: -400px; /* começa fora da tela */
      top: 0;
      width: 400px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      overflow-y: auto;
      transition: right 0.3s ease;
      padding: 20px;
    }
    .painel.ativo {
      right: 0;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .painel {
        width: 100%;
        height: 300px;
        right: 0;
        top: 100%;
        transition: top 0.3s ease;
      }
      .painel.ativo {
        top: calc(100% - 300px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mapa" id="mapa">
      <!-- Seu SVG vai aqui -->
      <object type="image/svg+xml" data="mapa.svg" id="svgmap"></object>
    </div>
    <div class="painel" id="painel">
      <h2>Card</h2>
      <img id="card-img" src="" alt="Card" style="max-width:100%">
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const cardImg = document.getElementById('card-img');

    document.getElementById('svgmap').addEventListener('load', function () {
      const svgDoc = this.contentDocument;
      if (!svgDoc) return;

      // Exemplo: botões no SVG com IDs iguais ao nome do arquivo
      const cidades = ["Fortaleza", "Rio", "Niteroi"];

      cidades.forEach(cidade => {
        const el = svgDoc.getElementById(cidade);
        if (el) {
          el.style.cursor = "pointer";
          el.addEventListener("click", () => {
            cardImg.src = `${cidade}.png`; // imagem deve estar na mesma pasta
            painel.classList.add("ativo");
          });
        }
      });
    });
  </script>
</body>
</html>
