<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Quântica</title>
  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Área do mapa */
    #mapa-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }

    svg {
      width: 90%;
      height: auto;
      cursor: pointer;
    }

    /* Painel lateral */
    #painel {
      width: 350px;
      background: #fff;
      border-left: 2px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      display: none; /* começa escondido */
    }

    #card {
      max-width: 100%;
      max-height: 80%;
      object-fit: contain;
    }

    .navegacao {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .navegacao button {
      padding: 5px 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Mapa -->
  <div id="mapa-container">
    <object id="mapa" type="image/svg+xml" data="mapa.svg"></object>
  </div>

  <!-- Painel lateral -->
  <div id="painel">
    <img id="card" src="" alt="Card da cidade">
    <div class="navegacao">
      <button id="prev">⟵</button>
      <span id="indicador">0 / 0</span>
      <button id="next">⟶</button>
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const cardImg = document.getElementById('card');
    const indicador = document.getElementById('indicador');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');

    let cidadeAtual = null;
    let indiceAtual = 1;
    let totalCards = 0;

    // Função para carregar card
    function carregarCard(cidade, indice) {
      const caminho = `cards/${cidade}-${indice}.jpg`;
      cardImg.src = caminho;
      indicador.textContent = `${indice} / ${totalCards}`;
    }

    // Configura navegação
    btnPrev.addEventListener('click', () => {
      if (indiceAtual > 1) {
        indiceAtual--;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnNext.addEventListener('click', () => {
      if (indiceAtual < totalCards) {
        indiceAtual++;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    // Quando o mapa carregar
    document.getElementById('mapa').addEventListener('load', function () {
      const svgDoc = this.contentDocument;

      // pega todas as cidades do SVG
      const cidades = svgDoc.querySelectorAll('[id]');

      cidades.forEach(cidade => {
        cidade.addEventListener('click', () => {
          cidadeAtual = cidade.id; // exemplo: "saopaulo"

          // Descobre quantos cards tem (tenta até não achar mais)
          totalCards = 0;
          for (let i = 1; i < 20; i++) { // limite de 20 cards por cidade
            const img = new Image();
            img.src = `cards/${cidadeAtual}-${i}.jpg`;
            img.onload = () => { totalCards = i; };
            img.onerror = () => {};
          }

          // Mostra painel e primeiro card
          painel.style.display = 'flex';
          indiceAtual = 1;
          carregarCard(cidadeAtual, indiceAtual);
        });
      });
    });
  </script>
</body>
</html>
