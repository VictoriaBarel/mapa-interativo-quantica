<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Quântica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #fff;
      display: flex;
      justify-content: center; /* mapa centralizado inicialmente */
      align-items: center;
      transition: all 0.3s ease;
    }

    #mapa-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 2; /* aumenta espaço do mapa */
      min-width: 600px;
      transition: all 0.3s ease;
    }

    svg, object#mapa {
      width: 120%; /* mapa maior */
      max-width: 1800px;
      height: auto;
      display: block;
    }

    #painel {
      background: #fff;
      border-left: 2px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
      display: none;
      transition: all 0.3s ease;
    }

    #fechar {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      color: #555;
    }

    #card {
      max-width: 500px; /* cards maiores */
      max-height: 400px;
      object-fit: contain;
      margin-top: 30px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .navegacao {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .navegacao button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #888;
      background-color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .navegacao button:hover {
      background-color: #f0f0f0;
      border-color: #555;
    }

    #indicador {
      font-size: 14px;
      color: #333;
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
      }

      #painel {
        flex-direction: row;
        width: 100%;
        border-left: none;
        border-top: 2px solid #ddd;
        padding: 5px;
      }

      #card {
        max-width: 70%;
        max-height: 200px;
        margin-top: 0;
      }

      .navegacao {
        gap: 10px;
      }

      #fechar {
        top: 5px;
        right: 5px;
      }
    }
  </style>
</head>
<body>
  <div id="mapa-container">
    <object id="mapa" type="image/svg+xml" data="https://victoriabarel.github.io/mapa-interativo-quantica/mapa.svg"></object>
  </div>

  <div id="painel">
    <span id="fechar">✖</span>
    <img id="card" src="" alt="Card da cidade">
    <div class="navegacao">
      <button id="prev">⟵</button>
      <span id="indicador">0 / 0</span>
      <button id="next">⟶</button>
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const cardImg = document.getElementById('card');
    const indicador = document.getElementById('indicador');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnFechar = document.getElementById('fechar');
    const mapaContainer = document.getElementById('mapa-container');

    let cidadeAtual = null;
    let indiceAtual = 1;

    const listaCards = [
      "salvador-1","belohorizonte-1","recife-1","recife-2","natal-1",
      "saocarlos-1","bauru-1","campinas-1","campinas-2","campinas-3",
      "saopaulo-1","saopaulo-2","saocarlos-2","niteroi-1","niteroi-2",
      "riodejaneiro-1","riodejaneiro-2","riodejaneiro-3",
      "florianopolis-1","santamaria-1","curitiba-1","uberlandia-1",
      "goiania-1","fortaleza-1","maceio-1","arapiraca-1","cuiaba-1",
      "patrocinio-1","araras-1","juizdefora-1","vitoria-1","petropolis-1",
      "sorocaba-1","cornelioprocopio-1","itapeva-1","pontagrossa-1",
      "santoandre-1","voltaredonda-1","voltaredonda-2","florestal-1"
    ];

    const cardsPorCidade = {};
    listaCards.forEach(nome => {
      const cidade = nome.replace(/-\d+$/, "");
      if (!cardsPorCidade[cidade]) cardsPorCidade[cidade] = [];
      cardsPorCidade[cidade].push(`https://victoriabarel.github.io/mapa-interativo-quantica/cards/${nome}.jpg`);
    });

    function carregarCard(cidade, indice) {
      cardImg.src = cardsPorCidade[cidade][indice - 1];
      indicador.textContent = `${indice} / ${cardsPorCidade[cidade].length}`;
    }

    btnPrev.addEventListener('click', () => {
      if (indiceAtual > 1) {
        indiceAtual--;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnNext.addEventListener('click', () => {
      if (indiceAtual < cardsPorCidade[cidadeAtual].length) {
        indiceAtual++;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnFechar.addEventListener('click', () => {
      painel.style.display = 'none';
      mapaContainer.style.justifyContent = 'center';
      mapaContainer.style.marginRight = '0';
    });

    document.getElementById('mapa').addEventListener('load', function() {
      const svgDoc = this.contentDocument;
      const cidadesSVG = svgDoc.querySelectorAll('[id]');

      cidadesSVG.forEach(cidade => {
        if (cardsPorCidade[cidade.id]) {
          cidade.style.cursor = 'pointer';
          cidade.addEventListener('click', () => {
            cidadeAtual = cidade.id;
            indiceAtual = 1;
            painel.style.display = 'flex';
            carregarCard(cidadeAtual, indiceAtual);
            if(window.innerWidth > 800){
              mapaContainer.style.justifyContent = 'flex-start';
              mapaContainer.style.marginRight = '20px';
            } else {
              mapaContainer.style.justifyContent = 'center';
              mapaContainer.style.margin = '0 auto';
            }
          });
        }
      });
    });
  </script>
</body>
</html>
