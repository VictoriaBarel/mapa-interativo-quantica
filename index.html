<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mapa Interativo - Quântica</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    #mapa-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: all 0.3s ease;
    }

    svg#mapa {
      display: block;
      max-width: none; /* tamanho original */
    }

    #painel {
      background: #fff;
      border-left: 2px solid #ddd;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
    }

    #fechar {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      color: #555;
    }

    #card {
      max-width: 500px;
      max-height: 400px;
      object-fit: contain;
      margin-top: 30px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .navegacao {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .navegacao button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #888;
      background-color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .navegacao button:hover {
      background-color: #f0f0f0;
      border-color: #555;
    }

    #indicador {
      font-size: 14px;
      color: #333;
    }

    @media (max-width: 800px) {
      #mapa-container {
        flex-direction: column;
        align-items: center;
      }

      #painel {
        width: 100%;
        border-left: none;
        border-top: 2px solid #ddd;
        padding: 5px;
        flex-direction: row;
      }

      #card {
        max-width: 70%;
        max-height: 200px;
        margin-top: 0;
      }

      .navegacao {
        gap: 10px;
      }

      #fechar {
        top: 5px;
        right: 5px;
      }
    }
  </style>
</head>
<body>
  <div id="mapa-container">
    <!-- COMEÇO DO SVG EMBUTIDO -->
    <svg id="mapa" xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
      <!-- Aqui você coloca todo o conteúdo do seu SVG exportado do Illustrator -->
      <!-- Exemplo de cidade: -->
      <g id="saopaulo" style="cursor:pointer;">
        <circle cx="500" cy="350" r="10" fill="#2cb86a"/>
      </g>
      <g id="riodejaneiro" style="cursor:pointer;">
        <circle cx="600" cy="400" r="10" fill="#2cb86a"/>
      </g>
      <!-- Repita para todas as cidades -->
    </svg>
    <!-- FIM DO SVG EMBUTIDO -->

    <div id="painel">
      <span id="fechar">✖</span>
      <img id="card" src="" alt="Card da cidade">
      <div class="navegacao">
        <button id="prev">⟵</button>
        <span id="indicador">0 / 0</span>
        <button id="next">⟶</button>
      </div>
    </div>
  </div>

  <script>
    const painel = document.getElementById('painel');
    const cardImg = document.getElementById('card');
    const indicador = document.getElementById('indicador');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnFechar = document.getElementById('fechar');
    const mapaContainer = document.getElementById('mapa-container');
    const svgMapa = document.getElementById('mapa');

    let cidadeAtual = null;
    let indiceAtual = 1;

    const listaCards = [
      "salvador-1","belohorizonte-1","recife-1","recife-2","natal-1",
      "saocarlos-1","bauru-1","campinas-1","campinas-2","campinas-3",
      "saopaulo-1","saopaulo-2","saocarlos-2","niteroi-1","niteroi-2",
      "riodejaneiro-1","riodejaneiro-2","riodejaneiro-3",
      "florianopolis-1","santamaria-1","curitiba-1","uberlandia-1",
      "goiania-1","fortaleza-1","maceio-1","arapiraca-1","cuiaba-1",
      "patrocinio-1","araras-1","juizdefora-1","vitoria-1","petropolis-1",
      "sorocaba-1","cornelioprocopio-1","itapeva-1","pontagrossa-1",
      "santoandre-1","voltaredonda-1","voltaredonda-2","florestal-1"
    ];

    const cardsPorCidade = {};
    listaCards.forEach(nome => {
      const cidade = nome.replace(/-\d+$/, "");
      if (!cardsPorCidade[cidade]) cardsPorCidade[cidade] = [];
      cardsPorCidade[cidade].push(`https://victoriabarel.github.io/mapa-interativo-quantica/cards/${nome}.jpg`);
    });

    function carregarCard(cidade, indice) {
      cardImg.src = cardsPorCidade[cidade][indice - 1];
      indicador.textContent = `${indice} / ${cardsPorCidade[cidade].length}`;
    }

    btnPrev.addEventListener('click', () => {
      if (indiceAtual > 1) {
        indiceAtual--;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnNext.addEventListener('click', () => {
      if (indiceAtual < cardsPorCidade[cidadeAtual].length) {
        indiceAtual++;
        carregarCard(cidadeAtual, indiceAtual);
      }
    });

    btnFechar.addEventListener('click', () => {
      painel.style.display = 'none';
      mapaContainer.style.justifyContent = 'center';
      mapaContainer.style.marginRight = '0';
    });

    // Adiciona clique em todas as cidades do SVG
    const cidadesSVG = svgMapa.querySelectorAll('[id]');
    cidadesSVG.forEach(cidade => {
      if (cardsPorCidade[cidade.id]) {
        cidade.addEventListener('click', () => {
          cidadeAtual = cidade.id;
          indiceAtual = 1;
          painel.style.display = 'flex';
          carregarCard(cidadeAtual, indiceAtual);

          if(window.innerWidth > 800){
            mapaContainer.style.justifyContent = 'flex-start';
            mapaContainer.style.marginRight = '20px';
          } else {
            mapaContainer.style.justifyContent = 'center';
            mapaContainer.style.margin = '0 auto';
          }
        });
      }
    });
  </script>
</body>
</html>
